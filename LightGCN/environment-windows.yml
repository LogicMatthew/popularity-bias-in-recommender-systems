name: LightGCN
channels:
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.7.9
  - cudatoolkit=11.3.1
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu113
      - --find-links https://data.dgl.ai/wheels/repo.html
      - torch==1.10.1+cu113
      - dgl-cu113==0.8.2
      - numpy==1.21.6
      - scipy==1.3.0
      - pandas==1.3.5
      - wandb==0.18.7
      - pybind11==2.13.6
      - matplotlib==3.5.3
      - python-dotenv==0.21.1

# -----------------------------------------------------------------------------
# INSTRUCTION: How to compile C++ Extension (sampling.so)
# -----------------------------------------------------------------------------
# The 'sampling.cpp' file (located in code/sources/) MUST be compiled manually
# before running the training. This extension provides efficient neighbor sampling.
#
# 1. Activate this environment:
#    conda activate LightGCN
#
# 2. Navigate to the directory containing sampling.cpp:
#    cd code/sources
#
# 3. Run the compilation commands (ensure g++ is available):
#   $pybind11_includes = python -m pybind11 --includes
#   g++ -O3 -Wall -shared -std=c++14 -fPIC $($pybind11_includes) sampling.cpp -o sampling.so -fvisibility=hidden
#
# 4. Verify that 'sampling.so' was created in the current folder.